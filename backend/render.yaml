# Render Blueprint — https://render.com/docs/blueprint-spec
# In Render: New + -> Blueprint -> pick this repo. It reads this file and
# provisions the service. Free plan; the filesystem is ephemeral, so the
# app re-seeds its SQLite DB on each boot (see app/seed.py).

services:
  - type: web
    name: paysentinel-api
    runtime: python
    rootDir: backend
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: PAYSENTINEL_SEED_ON_START
        value: "1"
      - key: PAYSENTINEL_SEED_COUNT
        value: "140"
      - key: PAYSENTINEL_USE_LLM
        value: "0"          # set to "1" and add ANTHROPIC_API_KEY to use real LLM explanations
      # - key: PAYSENTINEL_CORS_ORIGINS
      #   value: https://your-frontend.vercel.app
